name: Issue 19473 candidate validation

on:
  push:
    branches: [ci/19473-candidate]

permissions:
  contents: read

concurrency:
  group: issue-19473-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0
  CI: true
  NX_DAEMON: false
  BASE_SHA: 6081fb70b2447119ccdac44519e9a587a134b1c2

jobs:
  candidate:
    if: github.repository == 'AyobamiH/budibase'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 3
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
      - name: Record environment
        run: |
          mkdir -p evidence
          { git rev-parse HEAD; node --version; npm --version; docker --version; df -h .; } | tee evidence/environment.log
          git diff --stat "$BASE_SHA" -- packages/ | tee evidence/change-scope.log
      - name: Install Yarn
        run: npm install --global yarn@1.22.22
      - name: Install repository dependencies
        id: install
        run: yarn --frozen-lockfile 2>&1 | tee evidence/install.log
      - name: Prove regression tests fail on unmodified upstream
        id: red
        continue-on-error: true
        run: |
          source_file=packages/client/src/utils/buttonActions.js
          cp "$source_file" "$RUNNER_TEMP/buttonActions.candidate.js"
          trap 'cp "$RUNNER_TEMP/buttonActions.candidate.js" "$source_file"' EXIT
          git show "$BASE_SHA:$source_file" > "$source_file"
          set +e
          yarn workspace @budibase/client test src/utils/buttonActions.test.js --reporter=default --reporter=json --outputFile="$GITHUB_WORKSPACE/evidence/regression-baseline.json" 2>&1 | tee evidence/regression-baseline.log
          code=${PIPESTATUS[0]}
          set -e
          test "$code" -eq 1
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          const report = JSON.parse(fs.readFileSync('evidence/regression-baseline.json', 'utf8'))
          const expected = [
            'declares the form validation context dependency',
            'reveals errors on the selected form only',
            'still stops the action chain when client validation passes',
            'resolves confirmation when the validator throws',
          ].sort()
          const failed = report.testResults.flatMap(suite => suite.assertionResults)
            .filter(test => test.status === 'failed').map(test => test.title).sort()
          if (report.numFailedTests !== 4 || JSON.stringify(failed) !== JSON.stringify(expected)) {
            throw new Error(`Unexpected baseline failures: ${JSON.stringify(failed)}`)
          }
          console.log('Exactly the four intended regression assertions fail on upstream.')
          JS
      - name: Candidate native client suite
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          git diff --exit-code -- packages/client/src/utils/buttonActions.js
          yarn workspace @budibase/client test --reporter=default --reporter=json --outputFile="$GITHUB_WORKSPACE/evidence/client-tests.json" 2>&1 | tee evidence/client-tests.log
      - name: Lint changed files
        id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          yarn eslint packages/client/src/utils/buttonActions.js packages/client/src/utils/buttonActions.test.js 2>&1 | tee evidence/eslint.log
          yarn prettier --check packages/client/src/utils/buttonActions.js packages/client/src/utils/buttonActions.test.js 2>&1 | tee evidence/prettier.log
      - name: Build frontend and its dependencies
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: yarn build --scope @budibase/client --include-dependencies 2>&1 | tee evidence/client-build.log
      - name: Client type checking
        id: types
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: yarn workspace @budibase/client check:types 2>&1 | tee evidence/client-types.log
      - name: Validation outcome
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          RED: ${{ steps.red.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          LINT: ${{ steps.lint.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TYPES: ${{ steps.types.outcome }}
        run: |
          printf 'install=%s\nred_proof=%s\ntests=%s\nlint=%s\nbuild=%s\ntypes=%s\n' "$INSTALL" "$RED" "$TESTS" "$LINT" "$BUILD" "$TYPES" | tee evidence/outcome.txt >> "$GITHUB_STEP_SUMMARY"
          test "$INSTALL" = success && test "$RED" = success && test "$TESTS" = success && test "$LINT" = success && test "$BUILD" = success && test "$TYPES" = success
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-19473-candidate
          path: evidence/
          retention-days: 7
